name: mealin
description: Mealin - Connecting home kitchens with customers.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase (FCM only for push notifications)
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # Networking
  dio: ^5.4.0
  flutter_secure_storage: ^10.3.1
  
  # State Management
  provider: ^6.1.2
  
  # Payments
  razorpay_flutter: ^1.3.7
  
  # Maps & Location
  google_maps_flutter: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  
  # UI & Utilities
  google_fonts: ^8.2.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  path: ^1.9.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  cached_network_image: ^3.3.1
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.3.0
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  
  # Networking
  http: ^1.2.0

  # Visual Analytics
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2

  # MEAL Voice
  permission_handler: ^11.3.0
  flutter_tts: ^4.2.5
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  background_color: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  generate: true # Required for l10n
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
